{% extends "base.html" %}
{% load bootstrap5 %}

{% block title %} Courses {% endblock %}

{% block content %}
<div class="container-sm">
    <form method="post">
            {% csrf_token %}
            {% bootstrap_form form %}
            {% bootstrap_button button_type="submit" content="Save" %}

            {% if course %}
                <a href="{% url 'course-details' course.id %}" class="btn btn-secondary">Back to Course</a>
            {% else %}
                <a href="{% url 'courses' %}" class="btn btn-secondary">Back to Courses</a>
            {% endif %}

    </form>
</div>
{% endblock %}
